# ============================================================================
# 待安装软件清单 — 手动填写模板
# ============================================================================
#
# 用法：
#   每行一个软件，格式：软件名,版本(可选),编译器(gcc/bisheng/both)
#   版本为空则用 spack 默认最新
#   编译器为空则装 gcc + bisheng 两个版本
#
# ⚠ 注释必须整行 `#` 开头；不要写行尾注释（如 `openfoam,,gcc  # 只装 gcc`）——
#   行尾注释会混进第三个字段，让该行被静默跳过（脚本已会剥离行尾 #，但别依赖容错）。
#
# 示例（以下均为注释，不会被执行；`→` 后面是说明文字，不是格式的一部分）：
#   gromacs                     → 最新版，gcc+bisheng 都装
#   lammps,20230802.4           → 指定版本，gcc+bisheng 都装
#   openfoam,,gcc               → 最新版，只装 gcc
#   cp2k,,bisheng               → 最新版，只装 bisheng
#   quantum-espresso,7.2,both   → 指定版本，gcc+bisheng 都装
#
# ============================================================================

# 软件名,版本,编译器(gcc/bisheng/both)

# ── 在下方添加你的软件 ──────────────────────────────────────────────────────
fds,6.9.1,both
su2,7.5.1,both
cmaq,5.3,both
swan,4145,both
roms,4.2,both

